<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加载中...</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --panel: #ffffff;
            --border: #c8ccd1;
            --text: #202122;
            --muted: #54595d;
            --accent: #3366cc;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, #ffffff 0%, var(--bg) 60%, #e8edf5 100%);
            color: var(--text);
        }
        .loading-card {
            width: min(92vw, 460px);
            padding: 2rem 1.5rem;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--panel);
            box-shadow: 0 18px 50px rgba(32, 33, 34, 0.12);
            text-align: center;
        }
        .spinner { border: 4px solid rgba(51, 102, 204, 0.15); border-top-color: var(--accent); border-radius: 50%; width: 54px; height: 54px; animation: spin 0.9s linear infinite; margin: 0 auto 1.1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { font-size: 1.3rem; margin-bottom: 0.5rem; }
        p { font-size: 1rem; line-height: 1.65; color: var(--muted); }
        .hint { margin-top: 0.75rem; font-size: 0.9rem; }
    </style>
    <meta http-equiv="refresh" content="0.25;url={{ next_url }}">
    <script>
        window.addEventListener('DOMContentLoaded', function () {
            setTimeout(function () {
                window.location.replace('{{ next_url }}');
            }, 250);
        });
    </script>
</head>
<body>
    <div class="loading-card">
        <div class="spinner"></div>
        <h1>正在连接多元宇宙网络</h1>
        <p>页面正在生成或检索中，请稍候。</p>
        <p class="hint">如果网络较慢，loading 页面会先出现，再自动跳转到目标条目。</p>
    </div>
</body>
</html>
