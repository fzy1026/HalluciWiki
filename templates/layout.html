<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        :root {
            --bg: #f8f9fa;
            --panel: #ffffff;
            --border: #a2a9b1;
            --border-soft: #c8ccd1;
            --text: #202122;
            --muted: #54595d;
            --link: #0645ad;
            --link-hover: #0b0080;
            --accent: #3366cc;
            --accent-soft: #d8e3f2;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { background: var(--bg); }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: linear-gradient(180deg, #f6f7f8 0%, #eef1f4 100%); color: var(--text); min-height: 100vh; }
        a { color: var(--link); text-decoration: none; }
        a:hover { color: var(--link-hover); text-decoration: underline; }
        .site-shell { max-width: 1240px; margin: 0 auto; }
        .site-topbar {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.95rem 1.25rem;
            border-bottom: 1px solid var(--border-soft);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 20;
        }
        .brand {
            display: flex;
            flex-direction: column;
            line-height: 1.05;
            min-width: 0;
        }
        .brand strong {
            font-size: 1.05rem;
            letter-spacing: 0.02em;
        }
        .brand span {
            font-size: 0.8rem;
            color: var(--muted);
        }
        .site-nav {
            display: flex;
            align-items: center;
            gap: 0.9rem;
            flex-wrap: wrap;
        }
        .site-nav a {
            padding: 0.4rem 0.55rem;
            border-radius: 999px;
            color: #2a4b8d;
        }
        .site-nav a:hover {
            background: var(--accent-soft);
            text-decoration: none;
        }
        .nav-search {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            min-width: min(100%, 360px);
        }
        .nav-search form {
            display: flex;
            gap: 0.5rem;
            width: 100%;
        }
        .nav-search input {
            flex: 1;
            padding: 0.72rem 0.85rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #fff;
            color: var(--text);
            font-size: 0.95rem;
        }
        .nav-search input:focus {
            outline: 2px solid rgba(51, 102, 204, 0.25);
            border-color: var(--accent);
        }
        .nav-search button {
            padding: 0.72rem 1rem;
            border: 1px solid #2a4b8d;
            border-radius: 6px;
            background: linear-gradient(180deg, #3c6fd1 0%, #2a4b8d 100%);
            color: #fff;
            cursor: pointer;
            font-weight: 600;
        }
        .nav-search button:hover {
            filter: brightness(1.04);
        }
        main {
            max-width: 1040px;
            margin: 1.25rem auto 0;
            padding: 0 1rem 2rem;
        }
        article.wiki-article {
            background: var(--panel);
            border: 1px solid var(--border);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
            padding: clamp(1.25rem, 2vw, 2rem);
        }
        article.wiki-article h1 {
            font-size: clamp(1.9rem, 3vw, 2.55rem);
            line-height: 1.2;
            margin-bottom: 0.8rem;
            border-bottom: 1px solid var(--border-soft);
            padding-bottom: 0.6rem;
        }
        article.wiki-article h2,
        article.wiki-article h3 {
            margin-top: 1.45rem;
            margin-bottom: 0.7rem;
            padding-bottom: 0.3rem;
            border-bottom: 1px solid var(--border-soft);
        }
        article.wiki-article p,
        article.wiki-article li {
            line-height: 1.75;
            font-size: 1rem;
        }
        article.wiki-article p + p,
        article.wiki-article ul + p,
        article.wiki-article ol + p {
            margin-top: 0.9rem;
        }
        article.wiki-article ul,
        article.wiki-article ol {
            margin: 0.85rem 0 0.85rem 1.4rem;
        }
        article.wiki-article li + li {
            margin-top: 0.35rem;
        }
        article.wiki-article blockquote {
            border-left: 4px solid var(--accent);
            background: #f8fbff;
            margin: 1rem 0;
            padding: 0.9rem 1rem;
            color: #404244;
        }
        article.wiki-article table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
            font-size: 0.95rem;
        }
        article.wiki-article th,
        article.wiki-article td {
            border: 1px solid var(--border-soft);
            padding: 0.65rem 0.75rem;
            vertical-align: top;
        }
        article.wiki-article th {
            background: #f8f9fa;
            text-align: left;
        }
        article.wiki-article img {
            max-width: 100%;
            height: auto;
        }
        article.wiki-article hr {
            border: 0;
            border-top: 1px solid var(--border-soft);
            margin: 1.2rem 0;
        }
        .article-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
            color: var(--muted);
            font-size: 0.92rem;
        }
        .article-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.28rem 0.6rem;
            border: 1px solid var(--border-soft);
            border-radius: 999px;
            background: #f8f9fa;
        }
        footer {
            max-width: 1040px;
            margin: 0 auto;
            padding: 0 1rem 1.5rem;
            color: var(--muted);
            font-size: 0.9rem;
        }
        @media (max-width: 820px) {
            .site-topbar {
                align-items: stretch;
                flex-direction: column;
            }
            .nav-search {
                margin-left: 0;
                width: 100%;
            }
        }
    </style>
    <script>
        (function () {
            const loadingPrefix = '/loading?next=';

            function shouldIgnoreLink(link, event) {
                if (!link) return true;
                if (link.target && link.target !== '_self') return true;
                if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return true;
                const href = link.getAttribute('href') || '';
                return !href || href.startsWith('http://') || href.startsWith('https://') || href.startsWith('mailto:') || href.startsWith('tel:') || href.startsWith('#');
            }

            function goToLoading(nextUrl) {
                window.location.href = loadingPrefix + encodeURIComponent(nextUrl);
            }

            document.addEventListener('click', function (event) {
                const link = event.target.closest('a[href]');
                if (!link || shouldIgnoreLink(link, event)) {
                    return;
                }

                const href = link.getAttribute('href');
                if (href.startsWith('/wiki/') || href.startsWith('/search') || href === '/random') {
                    event.preventDefault();
                    goToLoading(href);
                }
            });

            document.addEventListener('submit', function (event) {
                const form = event.target.closest('form');
                if (!form) return;

                const action = form.getAttribute('action') || '/';
                const method = (form.getAttribute('method') || 'get').toLowerCase();
                if (method !== 'get' || action !== '/search') return;

                event.preventDefault();
                const params = new URLSearchParams(new FormData(form));
                const nextUrl = `${action}?${params.toString()}`;
                goToLoading(nextUrl);
            });
        })();
    </script>
</head>
<body>
<div class="site-shell">
    <header class="site-topbar">
        <div class="brand">
            <strong>HalluciWiki</strong>
            <span>百科检索站点</span>
        </div>
        <nav class="site-nav" aria-label="站点导航">
            <a href="/">首页</a>
            <a href="/about">关于本站</a>
            <a href="/random">随机条目</a>
        </nav>
        <div class="nav-search">
            <form action="/search" method="get" data-wiki-nav>
                <input type="text" name="q" placeholder="搜索条目、概念或事件" required>
                <button type="submit">搜索</button>
            </form>
        </div>
    </header>
    <main>
        <article class="wiki-article">
{{ content }}
        </article>
    </main>
</div>
<footer>
    HalluciWiki
</footer>
</body>
</html>
