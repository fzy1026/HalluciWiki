<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HalluciWiki</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; background: #f6f7f8; color: #202122; }
        nav { background: #1a1a2e; color: white; padding: 0.8em 1.5em; display: flex; align-items: center; flex-wrap: wrap; gap: 1em; }
        nav a { color: #e0e0ff; text-decoration: none; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        .nav-search { margin-left: auto; display: flex; align-items: center; }
        .nav-search input { padding: 0.4em; border: none; border-radius: 3px; width: 200px; }
        .nav-search button { padding: 0.4em 0.8em; background: #16213e; color: white; border: none; border-radius: 3px; cursor: pointer; margin-left: 0.3em; }
        main { max-width: 900px; margin: 2em auto; background: white; padding: 2em; box-shadow: 0 1px 4px rgba(0,0,0,0.1); min-height: 60vh; }
        footer { text-align: center; color: #666; font-size: 0.9em; padding: 1.5em; }
    </style>
</head>
<body>
<nav>
    <a href="/">🏠 首页</a>
    <a href="/about">📖 关于本站</a>
    <a href="/random">🎲 随机条目</a>
    <div class="nav-search">
        <form action="/search" method="get">
            <input type="text" name="q" placeholder="搜索多元宇宙..." required>
            <button type="submit">搜索</button>
        </form>
    </div>
</nav>
<main>
{{ content }}
</main>
<footer>
    HalluciWiki · 连接多元宇宙网络
</footer>
</body>
</html>
