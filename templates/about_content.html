<h1>关于 HalluciWiki</h1>
<p>HalluciWiki 是一个概念实验：所有条目都由大语言模型实时生成，再经过二次审核后呈现为维基百科风格的页面。</p>
<h2>它如何工作</h2>
<p>用户输入标题后，系统会生成一段正文 HTML，再交给模型进行一次修订。搜索结果页同样由模型生成，因此真实主题和虚构主题都可以并列出现。</p>
<h2>设计目标</h2>
<p>这个项目想模拟一种“看起来可信”的百科检索体验，让真实知识与虚构叙事混合在一起，同时保持清晰、可浏览的页面结构。</p>
