<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>加载中...</title>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; background: #1a1a2e; color: white; flex-direction: column; }
        .spinner { border: 4px solid rgba(255,255,255,0.2); border-top-color: #e0e0ff; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 1.5em; }
        @keyframes spin { to { transform: rotate(360deg); } }
        p { font-size: 1.2em; opacity: 0.8; }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <p>正在链接多元宇宙网络，请稍候...</p>
</body>
</html>
